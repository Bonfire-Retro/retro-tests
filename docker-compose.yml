services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: retroapi
      POSTGRES_DB: retroapi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d retroapi"]
      interval: 3s
      retries: 10

  auth-server:
    image: quay.io/keycloak/keycloak:26.6.0
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: "http://localhost:${KEYCLOAK_PORT:-8010}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${KEYCLOAK_PORT:-8010}:8080"
    volumes:
      - ../retro-api/keycloak-realm-data:/opt/keycloak/data/import
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 200"]
      interval: 5s
      retries: 30

  rabbitmq:
    build:
      context: ../retro-api
      dockerfile: RabbitMqDockerfile
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      retries: 10

  api:
    image: ${RETRO_API_IMAGE:-retro-api:latest}
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker,native
    depends_on:
      db: { condition: service_healthy }
      auth-server: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 3s
      retries: 20

  ui:
    image: ${RETRO_UI_IMAGE:-ghcr.io/lowbudgetman/retro-ui:latest}
    ports:
      - "${UI_PORT:-3000}:80"
    depends_on:
      api: { condition: service_healthy }
